version: '3.8'

services:
  paddy-doctor-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paddy-doctor-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
